<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>백준 냥이 데모</title>
  <style>
    body { margin: 0; font: 14px/1.6 "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; color: #333; background: #fff; }
    nav { display: flex; align-items: center; gap: 16px; padding: 10px 24px; border-bottom: 1px solid #e5e5e5; }
    nav b { font-size: 18px; }
    nav .sp { flex: 1; }
    .wrap { display: grid; grid-template-columns: 1fr 340px; gap: 24px; max-width: 1100px; margin: 24px auto; padding: 0 24px; }
    h2 { font-size: 18px; border-bottom: 2px solid #0076c0; padding-bottom: 4px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-top: 1px solid #ddd; padding: 6px 8px; text-align: left; }
    .result-ac { color: #009874; font-weight: bold; }
    .result-wa { color: #dd4124; font-weight: bold; }
    .result-wait, .result-judging { color: #a49e9e; }
    textarea { width: 100%; height: 120px; font-family: Consolas, monospace; }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 16px; }
    .btns button { padding: 6px 10px; }
    iframe { width: 344px; height: 640px; border: 1px solid #ddd; border-radius: 12px; }
    .note { color: #888; font-size: 12px; }
  </style>
  <script>
    // 확장 프로그램 없이 확인하기 위한 가짜 chrome API
    (() => {
      const listeners = [];
      const msgListeners = [];
      const area = (name) => {
        const KEY = 'bojKittyDemo_' + name;
        const read = () => JSON.parse(localStorage.getItem(KEY) || '{}');
        return {
          get(defaults, cb) {
            const res = { ...(defaults && typeof defaults === 'object' ? defaults : {}), ...read() };
            if (cb) setTimeout(() => cb(res));
            return Promise.resolve(res);
          },
          set(obj, cb) {
            const cur = read();
            const changes = {};
            for (const k in obj) { changes[k] = { oldValue: cur[k], newValue: obj[k] }; cur[k] = obj[k]; }
            localStorage.setItem(KEY, JSON.stringify(cur));
            setTimeout(() => { listeners.forEach((l) => l(changes, name)); cb && cb(); });
            return Promise.resolve();
          },
        };
      };
      window.__bojKittyChromeShim = {
        runtime: { id: 'demo', getURL: (p) => "../" + p, onMessage: { addListener: (f) => msgListeners.push(f) } },
        storage: { sync: area('sync'), local: area('local'), onChanged: { addListener: (f) => listeners.push(f) } },
        tabs: {
          query: async () => [{ id: 1 }],
          sendMessage: async (_id, msg) => { let r; msgListeners.forEach((f) => f(msg, {}, (x) => { r = x; })); return r; },
        },
      };
    })();
  </script>
</head>
<body>
  <nav><b>BOJ 데모</b><span>문제</span><span>채점 현황</span><span class="sp"></span><a class="username" href="/user/demo">demo</a></nav>
  <div class="wrap">
    <div>
      <h2>제출해보기</h2>
      <p class="note">아래 칸에 타이핑하면 냥이가 조용해져요. 버튼으로 채점 결과를 흉내낼 수 있어요.</p>
      <textarea placeholder="#include &lt;iostream&gt; ..."></textarea>
      <div class="btns">
        <button data-r="ac">맞았습니다 제출</button>
        <button data-r="wa">틀렸습니다 제출</button>
        <button data-r="tle">시간 초과 제출</button>
      </div>
      <h2>채점 현황</h2>
      <table id="status-table">
        <thead><tr><th>제출 번호</th><th>아이디</th><th>문제</th><th>결과</th></tr></thead>
        <tbody>
          <tr id="solution-100"><td>100</td><td><a href="/user/demo">demo</a></td><td>1000</td><td class="result"><span class="result-text result-ac">맞았습니다!!</span></td></tr>
        </tbody>
      </table>
      <div style="height: 900px"></div>
    </div>
    <iframe src="../popup/popup.html" title="팝업 미리보기"></iframe>
  </div>
  <script>
    let n = 101;
    const TXT = { ac: '맞았습니다!!', wa: '틀렸습니다', tle: '시간 초과' };
    document.querySelectorAll('[data-r]').forEach((b) => b.addEventListener('click', () => {
      const r = b.dataset.r;
      const tr = document.createElement('tr');
      tr.id = 'solution-' + n;
      tr.innerHTML = `<td>${n++}</td><td><a href="/user/demo">demo</a></td><td>1000</td><td class="result"><span class="result-text result-wait">기다리는 중</span></td>`;
      document.querySelector('#status-table tbody').prepend(tr);
      const span = () => tr.querySelector('.result-text');
      setTimeout(() => { span().className = 'result-text result-judging'; span().textContent = '채점 중 (42%)'; }, 700);
      setTimeout(() => { tr.querySelector('.result').innerHTML = `<span class="result-text result-${r}">${TXT[r]}</span>`; }, 1600);
    }));
  </script>
  <script src="../shared/defaults.js"></script>
  <script src="../content/kitty.js"></script>
</body>
</html>
